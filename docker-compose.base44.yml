services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      # Override the repo .env's localhost value to reach the compose service.
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=taxpilot_db
      - PYTHONUNBUFFERED=1
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:8081"
    environment:
      # Public URL of the backend API (separate origin). Expo inlines EXPO_PUBLIC_*
      # vars at bundle time; the real process env takes precedence over .env files.
      - EXPO_PUBLIC_BACKEND_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - EXPO_USE_FAST_RESOLVER=1
    depends_on:
      - backend

volumes:
  mongo_data:
  frontend_node_modules:
